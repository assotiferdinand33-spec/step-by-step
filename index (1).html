<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="Step by Step — Motivation, conseils et inspiration. Abonne-toi à nos réseaux sociaux.">
<title>Step by Step | Suis-nous</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{
  min-height:100vh;font-family:Arial,Helvetica,sans-serif;
  background:radial-gradient(circle at top,#26324a 0,#101522 42%,#070a10 100%);
  color:#fff;display:flex;justify-content:center;align-items:center;padding:24px;
}
.card{
  width:100%;max-width:430px;text-align:center;padding:34px 24px 28px;
  border:1px solid rgba(255,255,255,.12);border-radius:28px;
  background:rgba(12,16,27,.78);backdrop-filter:blur(16px);
  box-shadow:0 25px 70px rgba(0,0,0,.45);
}
.logo{
  width:92px;height:92px;margin:0 auto 18px;border-radius:50%;
  display:flex;align-items:center;justify-content:center;
  background:linear-gradient(135deg,#fff,#bfc7d8);color:#101522;
  font-weight:900;font-size:21px;box-shadow:0 10px 35px rgba(255,255,255,.18);
}
h1{font-size:32px;letter-spacing:-1px}
.handle{margin-top:7px;color:#aeb8ca}
.bio{margin:18px auto 24px;line-height:1.55;color:#e7ebf3;max-width:340px}
.links{display:grid;gap:13px}
a{
  text-decoration:none;color:white;font-weight:700;font-size:16px;
  padding:16px 18px;border-radius:15px;background:#171e2d;
  border:1px solid rgba(255,255,255,.09);transition:.2s;
  display:flex;align-items:center;justify-content:center;gap:10px;
}
a:hover{transform:translateY(-2px);background:#202a3d;border-color:rgba(255,255,255,.22)}
.subscribe{
  background:linear-gradient(135deg,#ffffff,#d8deea);color:#0d1320;
  margin-bottom:2px;font-size:17px;
}
.subscribe:hover{background:#fff}
.icon{font-size:20px}
.footer{margin-top:24px;color:#7f8ba0;font-size:12px}
</style>
</head>
<body>
<main class="card">
  <div class="logo">SBS</div>
  <h1>Step by Step</h1>
  <div class="handle">@step.by.step</div>
  <p class="bio">Un pas à la fois. Motivation, conseils et inspiration pour avancer, progresser et devenir une meilleure version de toi-même.</p>

  <div class="links">
    <a class="subscribe" href="https://www.youtube.com/@step-by-step-usa" target="_blank" rel="noopener">🔔 S'abonner à YouTube</a>
    <a href="https://www.tiktok.com/@step.by.step747?_r=1&_t=ZP-98k4505gIlq" target="_blank" rel="noopener"><span class="icon">♪</span> TikTok</a>
    <a href="https://www.instagram.com/invites/contact/?utm_source=ig_contact_invite&utm_medium=copy_link&utm_content=uehc76v" target="_blank" rel="noopener"><span class="icon">◎</span> Instagram</a>
    <a href="https://www.facebook.com/share/1BdDK3vAop/" target="_blank" rel="noopener"><span class="icon">f</span> Facebook</a>
  </div>

  <div class="footer">STEP BY STEP • Chaque jour, un pas de plus.</div>
</main>
</body>
</html>
